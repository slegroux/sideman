[project]
name = "sideman"
version = "0.1.0"
description = "Ableton Live MCP server with complete Live Object Model coverage"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
sideman = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.ruff.lint]
# Correctness rules only. The remote script deliberately keeps %-formatting
# and other old-style idioms, so the stylistic rule families stay off.
select = ["F", "E4", "E7", "E9"]
