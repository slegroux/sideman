[project]
name = "ableton-mcp-lom"
version = "0.1.0"
description = "Ableton Live MCP server with complete Live Object Model coverage"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
ableton-mcp-lom = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]
