[project]
name = "sideman"
version = "0.1.0"
description = "Ableton Live MCP server with complete Live Object Model coverage"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.2,<3"]

[project.optional-dependencies]
# Local audio analysis (audio_analyze, audio_compare). Not in the base install.
listen = ["numpy>=1.24", "soundfile>=0.12"]

[project.scripts]
sideman = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "sideman"]

[tool.ruff.lint]
# Correctness rules only. The remote script deliberately keeps %-formatting
# and other old-style idioms, so the stylistic rule families stay off.
select = ["F", "E4", "E7", "E9"]

[tool.pytest.ini_options]
# Tests write WAV files into tmp_path: a full run leaves about 7 GB, and
# pytest's default keeps the last three runs. Keep only failed tests' files.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
