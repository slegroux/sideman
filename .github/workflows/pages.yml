# Publish site/ as the GitHub Pages site. Pages' branch source only serves /
# or /docs, and docs/ is the markdown documentation, so the landing page goes
# up through the Actions source instead and stays where gen_docs --check
# expects it.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The lessons are a Quarto book rendered into site/learn/ from frozen
      # notebook outputs; nothing executes on the runner.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.39
      - run: docs/render.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
