project:
  type: book
  output-dir: ../site/learn
  # Only the book's own inputs; the other markdown files in docs/ are the
  # repository's reference docs and are not chapters.
  render:
    - index.md
    - "make/*.md"
    - tutorial.ipynb
    - "lessons/*.ipynb"

book:
  title: "Sideman"
  subtitle: "A melodic house track, start to finish"
  chapters:
    - index.md
    - part: "Make a track with Claude"
      chapters:
        - make/00-start-here.md
        - make/01-orientation.md
        - make/02-drums.md
        - make/03-bass.md
        - make/04-harmony.md
        - make/05-melody-and-arp.md
        - make/06-sound-design.md
        - make/07-movement.md
        - make/08-arrangement.md
        - make/09-audio.md
        - make/10-mixing.md
    - part: "Under the hood"
      chapters:
        - tutorial.ipynb
  page-navigation: true
  repo-url: https://github.com/slegroux/sideman
  sidebar:
    logo: ../assets/logo-light.svg

format:
  html:
    theme: [cosmo]
    toc: true
    code-fold: false
    code-tools: false

# Never execute on render: the cells talk to a running Ableton Live. Outputs
# are frozen by the author when a lesson is written, and re-executing the
# notebook against a fresh Set is how a lesson is verified.
execute:
  enabled: false
