project:
  type: book
  output-dir: ../site/learn
  # Only the book's own inputs; the remaining markdown files in docs/
  # (COVERAGE.md, DEMO_SCRIPT.md, TUTORIAL.md) are repository documentation and
  # are not chapters.
  render:
    - index.md
    - make/00-start-here.md
    - tutorial.ipynb
    - TOOLS.md
    - PROTOCOL.md
    - CLIENT.md
    - CONVENTIONS.md

book:
  title: "Sideman"
  subtitle: "A melodic house track, start to finish"
  chapters:
    - index.md
    - make/00-start-here.md
    - tutorial.ipynb
    # TOOLS.md and CLIENT.md are generated by scripts/gen_docs.py and checked
    # with --check, so the book cannot ship a stale API table.
    - part: "Reference"
      chapters:
        - TOOLS.md
        - PROTOCOL.md
        - CLIENT.md
        - CONVENTIONS.md
  page-navigation: true
  repo-url: https://github.com/slegroux/sideman
  sidebar:
    logo: img/logo-light.svg
    tools:
      - icon: house
        href: ../
        text: Sideman

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    code-tools: false
    css: lom-links.css

# Never execute on render: the cells talk to a running Ableton Live. Outputs
# are frozen by the author when a lesson is written, and re-executing the
# notebook against a fresh Set is how a lesson is verified.
execute:
  enabled: false
